<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch Checklist — sample app</title>
<!-- Fictional sample app used only to demo recording-demo-videos. Not a real product. -->
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb;
    --brand: #1f2937; --accent: #f59e0b; --ok: #10b981;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--brand); color: #fff; padding: 18px 40px; display: flex; align-items: center; gap: 14px; }
  .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); display: grid; place-items: center;
    font-weight: 800; color: var(--brand); }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  header .tag { margin-left: auto; font-size: 12px; opacity: .7; border: 1px solid rgba(255,255,255,.35);
    border-radius: 999px; padding: 3px 10px; }
  main { max-width: 760px; margin: 36px auto; padding: 0 24px; }
  .readiness { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; margin-bottom: 18px; }
  .readiness .row { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .readiness strong { color: var(--ink); font-size: 15px; }
  .bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .5s ease; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  form { display: flex; gap: 10px; padding: 16px; border-bottom: 1px solid var(--line); }
  form input { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: inherit; outline: none; }
  form input:focus { border-color: var(--accent); }
  form button { border: 0; border-radius: 10px; padding: 0 20px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  ul { list-style: none; margin: 0; padding: 0; min-height: 60px; }
  li { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); animation: in .25s ease; }
  li input { width: 20px; height: 20px; accent-color: var(--ok); cursor: pointer; }
  li.done span { color: var(--muted); text-decoration: line-through; }
  li .pill { margin-left: auto; font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 999px; padding: 2px 10px; }
  .empty { padding: 22px 18px; color: var(--muted); font-size: 14px; }
  footer { display: flex; align-items: center; gap: 6px; padding: 12px 16px; font-size: 14px; color: var(--muted); }
  footer .count { margin-right: auto; }
  footer button { border: 1px solid transparent; background: none; border-radius: 8px; padding: 5px 12px; font: inherit; color: var(--muted); cursor: pointer; }
  footer button.on { border-color: var(--line); color: var(--ink); background: var(--bg); }
  @keyframes in { from { opacity: 0; transform: translateY(-4px); } }
</style>
</head>
<body>
<header>
  <div class="logo">L</div>
  <h1 data-i18n="title"></h1>
  <span class="tag" data-i18n="sample"></span>
</header>
<main>
  <section class="readiness">
    <div class="row"><strong data-i18n="readiness"></strong><span id="pct">0%</span></div>
    <div class="bar"><div id="bar"></div></div>
  </section>
  <section class="card">
    <form id="add">
      <input id="new-task" autocomplete="off">
      <button type="submit" data-i18n="add"></button>
    </form>
    <ul id="list"></ul>
    <footer>
      <span class="count" id="count"></span>
      <button data-filter="all" class="on" data-i18n="all"></button>
      <button data-filter="active" data-i18n="active"></button>
      <button data-filter="done" data-i18n="done"></button>
    </footer>
  </section>
</main>
<script>
  const I18N = {
    en: { title: "Launch Checklist", sample: "sample app", readiness: "Launch readiness", add: "Add",
      placeholder: "Add a launch task…", all: "All", active: "Active", done: "Done",
      empty: "No tasks yet — add the first one above.", left: (n) => `${n} task${n === 1 ? "" : "s"} left`, pill: "launch" },
    pt: { title: "Checklist de Lançamento", sample: "app de exemplo", readiness: "Prontidão do lançamento", add: "Adicionar",
      placeholder: "Adicione uma tarefa do lançamento…", all: "Todas", active: "Ativas", done: "Concluídas",
      empty: "Nenhuma tarefa ainda — adicione a primeira acima.", left: (n) => `${n} tarefa${n === 1 ? "" : "s"} pendente${n === 1 ? "" : "s"}`, pill: "lançamento" },
  };
  const lang = new URLSearchParams(location.search).get("lang") === "pt" ? "pt" : "en";
  const t = I18N[lang];
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t[el.dataset.i18n]; });
  document.getElementById("new-task").placeholder = t.placeholder;

  const tasks = [];
  let filter = "all";
  const list = document.getElementById("list");

  function render() {
    const shown = tasks.filter((x) => filter === "all" || (filter === "done" ? x.done : !x.done));
    list.replaceChildren(...shown.map((task) => {
      const li = document.createElement("li");
      li.className = task.done ? "done" : "";
      const box = document.createElement("input");
      box.type = "checkbox"; box.checked = task.done;
      box.addEventListener("change", () => { task.done = box.checked; render(); });
      const text = document.createElement("span"); text.textContent = task.text;
      const pill = document.createElement("span"); pill.className = "pill"; pill.textContent = t.pill;
      li.append(box, text, pill);
      return li;
    }));
    if (!shown.length) {
      const li = document.createElement("li"); li.className = "empty"; li.textContent = t.empty; list.append(li);
    }
    const done = tasks.filter((x) => x.done).length;
    const pct = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
    document.getElementById("pct").textContent = `${pct}%`;
    document.getElementById("bar").style.width = `${pct}%`;
    document.getElementById("count").textContent = t.left(tasks.length - done);
    document.querySelectorAll("[data-filter]").forEach((b) => b.classList.toggle("on", b.dataset.filter === filter));
  }

  document.getElementById("add").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("new-task");
    if (input.value.trim()) tasks.push({ text: input.value.trim(), done: false });
    input.value = "";
    render();
  });
  document.querySelectorAll("[data-filter]").forEach((b) =>
    b.addEventListener("click", () => { filter = b.dataset.filter; render(); }));
  render();
</script>
</body>
</html>
